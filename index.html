<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多平台内容发布工具</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="内容编辑工作台">
        <header class="workspace-header">
          <div>
            <p class="eyebrow">Creator Publishing Workspace</p>
            <h1>多平台内容发布工具</h1>
          </div>
          <div class="account-bar">
            <span id="accountStatus">未登录</span>
            <button class="secondary-button" id="logoutButton" type="button">退出</button>
            <button class="publish-button" id="publishButton" type="button">一键模拟发布</button>
          </div>
        </header>

        <section class="auth-panel" id="authPanel" aria-label="用户登录">
          <div>
            <h2>用户登录</h2>
            <p>注册或登录后，可使用后端适配、异步发布任务和发布记录能力。</p>
          </div>
          <div class="auth-form">
            <input id="usernameInput" type="text" placeholder="用户名" autocomplete="username" />
            <input id="passwordInput" type="password" placeholder="密码" autocomplete="current-password" />
            <button class="secondary-button" id="loginButton" type="button">登录</button>
            <button class="secondary-button" id="registerButton" type="button">注册</button>
          </div>
          <span class="auth-message" id="authMessage"></span>
        </section>

        <div class="editor-layout">
          <form class="editor-panel" id="contentForm">
            <label class="field">
              <span>标题</span>
              <input id="titleInput" type="text" placeholder="输入要发布的内容标题" />
            </label>

            <label class="field">
              <span>正文</span>
              <textarea id="bodyInput" rows="14" placeholder="输入正文内容，后续会按平台自动适配"></textarea>
            </label>

            <label class="field">
              <span>标签</span>
              <input id="tagsInput" type="text" placeholder="用逗号分隔，例如 创作,效率,工具" />
            </label>
          </form>

          <aside class="preview-panel" aria-label="多平台内容预览">
            <div class="preview-toolbar">
              <span>平台预览</span>
              <span id="wordCount">0 字</span>
            </div>
            <div class="platform-tabs" id="platformTabs" aria-label="选择预览平台"></div>
            <article class="preview-card">
              <h2 id="previewTitle">等待输入标题</h2>
              <p id="previewBody">在左侧输入正文后，这里会展示内容预览。</p>
              <div class="tag-list" id="previewTags"></div>
              <div class="platform-tips" id="platformTips"></div>
            </article>
          </aside>
        </div>

        <section class="publish-panel" aria-label="模拟发布结果">
          <div class="publish-header">
            <h2>发布状态</h2>
            <span id="publishSummary">等待发布</span>
          </div>
          <div class="publish-grid" id="publishResults"></div>
        </section>

        <section class="history-panel" aria-label="发布记录">
          <div class="publish-header">
            <h2>发布记录</h2>
            <button class="secondary-button" id="refreshHistoryButton" type="button">刷新</button>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>

        <section class="detail-panel hidden" id="recordDetailPanel" aria-label="发布记录详情">
          <div class="publish-header">
            <h2>记录详情</h2>
            <button class="secondary-button" id="closeDetailButton" type="button">关闭</button>
          </div>
          <div class="record-detail" id="recordDetail"></div>
        </section>
      </section>
    </main>

    <script src="./src/platformAdapters.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
